spring.application.name=training

# Importa el .env de la raiz del proyecto, asi las credenciales viven en un solo lugar.
# optional: si no existe (por ejemplo dentro de Docker) la app arranca igual con las variables de entorno.
spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/capacitacion}
spring.datasource.username=${POSTGRES_USER:trinidad}
spring.datasource.password=${POSTGRES_PASSWORD:capacitacion123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

jitsi.app-id=${JITSI_APP_ID}
jitsi.kid=${JITSI_KID}
jitsi.domain=${JITSI_DOMAIN:8x8.vc}
jitsi.private-key=${JITSI_PRIVATE_KEY_PATH}
jitsi.token-ttl-seconds=${JITSI_TOKEN_TTL_SECONDS:600}

logging.level.edu.studyarena.training.security=DEBUG
